[project]
name = "myagent"
version = "0.1.0"
description = "MyAgent：从零实现的生产级 Agent（包名 agentlab）"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    # jsonschema 本体不带 py.typed，配 mypy strict 必须有这份存根，
    # 否则 registry.py 会报 import-untyped（不能为它关严格模式）。
    "types-jsonschema>=4.21",
]

[project.scripts]
agentlab = "agentlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentlab"]

[tool.ruff]
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["agentlab"]
