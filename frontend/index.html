<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyAgent · 对话测试台</title>
<!-- 内联 SVG 图标：浏览器默认会去要 /favicon.ico，服务端没有这条路由就记一条 404 噪音。
     用 data URI 声明图标后，浏览器不再发那个请求，也不用为它加一条路由。 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234d8bff'/%3E%3Cpath d='M8 23V9h3.2l4.8 6.9 4.8-6.9H24v14h-3v-8.3l-4.2 5.9h-1.6L11 14.7V23z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --line: #2a2f3a;
    --fg: #e6e9ef;
    --fg-dim: #98a0b3;
    --accent: #4d8bff;
    --user: #1f3a63;
    --ok: #3ecf8e;
    --warn: #f0b429;
    --err: #ff6b6b;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* ---------- 顶栏 ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .logo { font-weight: 650; letter-spacing: .2px; }
  .logo span { color: var(--fg-dim); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-family: var(--mono);
    color: var(--fg-dim);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-dim); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.bad { background: var(--err); }
  .spacer { flex: 1; }
  button {
    font: inherit;
    color: var(--fg);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 7px 13px;
    cursor: pointer;
    transition: border-color .15s, background .15s, opacity .15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }

  /* ---------- 消息区 ---------- */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 22px 20px 8px;
  }
  .wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .empty {
    text-align: center;
    color: var(--fg-dim);
    padding: 64px 20px;
    font-size: 14px;
  }
  .empty code {
    font-family: var(--mono);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1px 5px;
  }
  .msg { display: flex; flex-direction: column; gap: 6px; }
  .msg.user { align-items: flex-end; }
  .bubble {
    max-width: 88%;
    padding: 11px 15px;
    border-radius: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--user);
    border: 1px solid #2b4f85;
    border-bottom-right-radius: 5px;
  }
  .msg.bot .bubble {
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom-left-radius: 5px;
  }
  .msg.bot .bubble.err { border-color: #5a2a2a; background: #221719; }
  .bubble.err .err-head { color: var(--err); font-weight: 600; margin-bottom: 4px; }
  .bubble.err .err-body { font-family: var(--mono); font-size: 12.5px; color: #d7b9b9; }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--fg-dim);
  }
  .meta span {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1px 7px;
  }
  .meta span.hot { color: var(--warn); border-color: #4a3d1b; }

  .tools {
    max-width: 88%;
    border: 1px solid #4a3d1b;
    background: #1c1a14;
    border-radius: 10px;
    padding: 8px 12px;
    font-family: var(--mono);
    font-size: 12.5px;
  }
  .tools > summary { cursor: pointer; color: var(--warn); }
  .tools pre {
    margin: 8px 0 0;
    overflow-x: auto;
    color: #d9d2c0;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .note {
    max-width: 88%;
    font-size: 12.5px;
    color: var(--warn);
    background: #1c1a14;
    border: 1px dashed #4a3d1b;
    border-radius: 8px;
    padding: 6px 10px;
  }

  .typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--fg-dim); animation: blink 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  /* ---------- 输入区 ---------- */
  footer {
    flex: none;
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 10px 20px 16px;
  }
  .foot-inner { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 9px; }
  details.sys { font-size: 13px; color: var(--fg-dim); }
  details.sys summary { cursor: pointer; user-select: none; }
  details.sys summary b { color: var(--fg); font-weight: 500; }
  details.sys textarea {
    width: 100%;
    margin-top: 8px;
    min-height: 60px;
    resize: vertical;
    background: var(--panel-2);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 11px;
    font: var(--mono);
    font-size: 12.5px;
  }
  .composer {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 9px 9px 9px 13px;
    transition: border-color .15s;
  }
  .composer:focus-within { border-color: var(--accent); }
  #input {
    flex: 1;
    min-height: 26px;
    max-height: 180px;
    resize: none;
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    font: inherit;
    line-height: 1.55;
    padding: 2px 0;
  }
  #input::placeholder { color: #697086; }
  .hint { font-size: 11.5px; color: #697086; text-align: right; }
  .hint kbd {
    font-family: var(--mono);
    font-size: 11px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0 4px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">MyAgent<span>对话测试台</span></div>
  <div class="pill" id="health"><i class="dot" id="healthDot"></i><span id="healthText">检查服务…</span></div>
  <div class="spacer"></div>
  <div class="pill" id="stats" title="本次会话累计">tokens 0 / 0</div>
  <button id="clear" title="清空当前会话">清空</button>
</header>

<main id="scroller">
  <div class="wrap" id="list">
    <div class="empty" id="empty">
      发一句话试试：<code>用一句话说明你是谁</code><br>
      上面的输入框回车发送，<kbd>Shift</kbd>+<kbd>Enter</kbd> 换行。
    </div>
  </div>
</main>

<footer>
  <div class="foot-inner">
    <details class="sys">
      <summary>system prompt（可选，仅本次请求生效；留空则不带）</summary>
      <textarea id="sys" placeholder="例如：你是 MyAgent，一个命令行编程助手。只回答一句话，不要寒暄。"></textarea>
    </details>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="输入消息，Enter 发送…"></textarea>
      <button class="primary" id="send">发送</button>
    </div>
    <div class="hint">POST /chat · 单轮无状态 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</div>
  </div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const list = $("list");
const scroller = $("scroller");
const input = $("input");
const sendBtn = $("send");
const sysEl = $("sys");

let busy = false;
let totals = { in: 0, out: 0 };

// system prompt 记住上次填的，免得每次重输
sysEl.value = localStorage.getItem("myagent.sys") || "";
sysEl.addEventListener("input", () => localStorage.setItem("myagent.sys", sysEl.value));


// ---------- 健康检查 ----------
async function checkHealth() {
  const dot = $("healthDot");
  const text = $("healthText");
  try {
    const r = await fetch("/health", { cache: "no-store" });
    if (!r.ok) throw new Error(String(r.status));
    const h = await r.json();
    dot.className = "dot ok";
    text.textContent = `${h.model} · v${h.version} · uptime ${h.uptime_s}s`;
  } catch (e) {
    dot.className = "dot bad";
    text.textContent = "服务不可用";
  }
}

// ---------- 消息渲染 ----------
function clearEmpty() {
  const empty = $("empty");
  if (empty) empty.remove();
}

function bubble(role, cls) {
  const msg = document.createElement("div");
  msg.className = "msg " + role;
  const b = document.createElement("div");
  b.className = "bubble" + (cls ? " " + cls : "");
  msg.appendChild(b);
  list.appendChild(msg);
  return { msg, b };
}

function scrollDown() {
  scroller.scrollTop = scroller.scrollHeight;
}

function addUser(text) {
  clearEmpty();
  const { b } = bubble("user");
  b.textContent = text;
  scrollDown();
}

function addTyping() {
  const { msg, b } = bubble("bot");
  b.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  scrollDown();
  return msg;
}

function addMeta(msg, d, clientRtt) {
  const meta = document.createElement("div");
  meta.className = "meta";
  const items = [
    ["stop", d.stop_reason],
    ["latency", d.latency_ms + "ms"],
    ["in", d.usage.input_tokens],
    ["out", d.usage.output_tokens],
    ["rtt", clientRtt + "ms"],
  ];
  if (d.usage.cached_input_tokens > 0) {
    items.push(["cached", d.usage.cached_input_tokens]);
  }
  for (const [k, v] of items) {
    const s = document.createElement("span");
    s.textContent = `${k} ${v}`;
    if (k === "cached") s.className = "hot";
    meta.appendChild(s);
  }
  msg.appendChild(meta);

  totals.in += d.usage.input_tokens;
  totals.out += d.usage.output_tokens;
  $("stats").textContent = `tokens ${totals.in} / ${totals.out}`;
}

function addTools(msg, calls) {
  const box = document.createElement("details");
  box.className = "tools";
  box.open = true;
  const s = document.createElement("summary");
  s.textContent = `模型要求调用 ${calls.length} 个工具（尚未执行）`;
  box.appendChild(s);
  for (const c of calls) {
    const pre = document.createElement("pre");
    pre.textContent = `${c.name}(${c.id})\narguments: ${c.arguments}`;
    box.appendChild(pre);
  }
  msg.appendChild(box);
}

function addNote(text) {
  const note = document.createElement("div");
  note.className = "note";
  note.textContent = "⚠ " + text;
  list.appendChild(note);
  scrollDown();
}

function addError(status, payload, clientRtt) {
  clearEmpty();
  const { msg, b } = bubble("bot", "err");
  const head = document.createElement("div");
  head.className = "err-head";
  const type = payload?.error?.type || "HTTPError";
  head.textContent = `请求失败 · HTTP ${status} · ${type}`;
  const body = document.createElement("div");
  body.className = "err-body";
  body.textContent = payload?.error?.message || JSON.stringify(payload);
  b.append(head, body);
  const meta = document.createElement("div");
  meta.className = "meta";
  const s = document.createElement("span");
  s.textContent = `rtt ${clientRtt}ms`;
  meta.appendChild(s);
  msg.appendChild(meta);
  scrollDown();
}

// ---------- 发送 ----------
async function send() {
  const text = input.value.trim();
  if (!text || busy) return;

  busy = true;
  sendBtn.disabled = true;
  input.value = "";
  autoGrow();

  addUser(text);
  const typing = addTyping();

  const body = { text };
  const sys = sysEl.value.trim();
  if (sys) body.system = sys;

  const t0 = performance.now();
  try {
    const r = await fetch("/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    const rtt = Math.round(performance.now() - t0);
    const data = await r.json().catch(() => null);
    typing.remove();

    if (!r.ok) {
      addError(r.status, data, rtt);
      return;
    }
    const { msg, b } = bubble("bot");
    b.textContent = data.text || "(空回复)";
    addMeta(msg, data, rtt);
    if (data.tool_calls?.length) addTools(msg, data.tool_calls);
    if (data.note) addNote(data.note);
    scrollDown();
  } catch (e) {
    typing.remove();
    addError(0, { error: { type: "NetworkError", message: String(e) } }, Math.round(performance.now() - t0));
  } finally {
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

// ---------- 输入框行为 ----------
function autoGrow() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
}

input.addEventListener("input", autoGrow);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
  }
});
sendBtn.addEventListener("click", send);

$("clear").addEventListener("click", () => {
  list.innerHTML = "";
  const empty = document.createElement("div");
  empty.className = "empty";
  empty.id = "empty";
  empty.innerHTML = '发一句话试试：<code>用一句话说明你是谁</code>';
  list.appendChild(empty);
  totals = { in: 0, out: 0 };
  $("stats").textContent = "tokens 0 / 0";
  input.focus();
});

checkHealth();
setInterval(checkHealth, 15000);
input.focus();
</script>
</body>
</html>
